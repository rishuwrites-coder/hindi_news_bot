name: make-news-short
on:
  schedule: [{cron: "30 2,8,13 * * *"}]   # 8:00, 14:00, 19:00 IST
  workflow_dispatch:
permissions: {contents: write}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core libraqm0 libfribidi0 libharfbuzz0b
          pip install -r requirements.txt
      - run: python src/main.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          CHANNEL_NAME: ${{ vars.CHANNEL_NAME }}
      - uses: actions/upload-artifact@v4
        with: {name: short, path: output/*, retention-days: 14}
      - run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add used.json && git commit -m "mark used" && git push || true
